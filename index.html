<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070916">
  <title>PK XD PORTAL. Студия правил</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --app-bg: #070916;
      --panel: #0e1121;
      --panel-2: #14182b;
      --line: rgba(255, 255, 255, 0.1);
      --text: #f7f8ff;
      --muted: #989fb8;
      --accent: #ff74d8;
      --accent-2: #8c70ff;
      --danger: #ff567d;
      --success: #68efb0;
      --radius: 20px;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--app-bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 72px 1fr;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 9, 22, 0.88);
      backdrop-filter: blur(18px);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #07101c;
      background: linear-gradient(135deg, var(--accent), #ffffff 62%, var(--accent-2));
      box-shadow: 0 0 26px rgba(89, 232, 255, 0.24);
    }

    .brand-mark svg {
      width: 24px;
      height: 24px;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy strong,
    .brand-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-copy strong {
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .brand-copy span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .header-actions,
    .toolbar-group,
    .button-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .button-row > * {
      flex: 1;
    }

    .icon-btn,
    .action-btn,
    .ghost-btn,
    .page-button,
    .theme-button,
    .add-rule,
    .remove-rule {
      border: 0;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease, opacity 160ms ease;
    }

    .icon-btn:focus-visible,
    .action-btn:focus-visible,
    .ghost-btn:focus-visible,
    .page-button:focus-visible,
    .theme-button:focus-visible,
    .add-rule:focus-visible,
    .remove-rule:focus-visible,
    [contenteditable="true"]:focus-visible {
      outline: 3px solid rgba(89, 232, 255, 0.7);
      outline-offset: 3px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel-2);
    }

    .icon-btn:hover:not(:disabled),
    .ghost-btn:hover:not(:disabled) {
      background: #1b2036;
    }

    .icon-btn:active:not(:disabled),
    .action-btn:active:not(:disabled),
    .ghost-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.38;
    }

    .icon-btn svg,
    .action-btn svg,
    .ghost-btn svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    .action-btn,
    .ghost-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 15px;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 800;
    }

    .action-btn {
      color: #07101c;
      background: linear-gradient(135deg, var(--accent), #e7fcff);
      box-shadow: 0 10px 30px rgba(89, 232, 255, 0.16);
    }

    .action-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 34px rgba(89, 232, 255, 0.24);
    }

    .ghost-btn {
      border: 1px solid var(--line);
      background: var(--panel-2);
    }

    .main-layout {
      min-width: 0;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }

    .control-panel {
      position: sticky;
      top: 72px;
      height: calc(100vh - 72px);
      overflow-y: auto;
      padding: 18px;
      border-right: 1px solid var(--line);
      background: #0a0d1a;
    }

    .panel-section {
      padding: 0 0 22px;
      margin: 0 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .panel-section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #cbd0e2;
    }

    .section-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .page-list {
      display: grid;
      gap: 8px;
    }

    .page-button {
      width: 100%;
      display: grid;
      grid-template-columns: 38px 1fr 16px;
      align-items: center;
      gap: 10px;
      min-height: 66px;
      padding: 9px 11px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 15px;
      background: transparent;
    }

    .page-button:hover {
      background: var(--panel);
    }

    .page-button.active {
      border-color: rgba(89, 232, 255, 0.25);
      background: linear-gradient(135deg, rgba(89, 232, 255, 0.12), rgba(123, 97, 255, 0.08));
    }

    .page-number {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: var(--muted);
      background: var(--panel-2);
      font-size: 12px;
      font-weight: 900;
    }

    .page-button.active .page-number {
      color: #06111b;
      background: var(--accent);
    }

    .page-button-copy strong,
    .page-button-copy small {
      display: block;
    }

    .page-button-copy strong {
      margin-bottom: 4px;
      font-size: 14px;
    }

    .page-button-copy small {
      color: var(--muted);
      font-size: 12px;
    }

    .page-chevron {
      color: var(--muted);
      font-size: 18px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .theme-button {
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 10px 6px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
      font-weight: 800;
    }

    .theme-button.active {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.3);
      background: var(--panel-2);
    }

    .theme-dot {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.18);
    }

    .theme-dot.portal {
      background: linear-gradient(135deg, #ff74d8, #8c70ff);
    }

    .theme-dot.ember {
      background: linear-gradient(135deg, #ffcf58, #ff4f75);
    }

    .theme-dot.ice {
      background: linear-gradient(135deg, #9eeaff, #2985ff);
    }

    .field-label {
      display: block;
      margin: 15px 0 8px;
      color: #cbd0e2;
      font-size: 13px;
      font-weight: 700;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 42px;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .range-value {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .helper {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .workspace {
      min-width: 0;
      padding: 20px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        #080b17;
      background-size: 28px 28px;
    }

    .workspace-toolbar {
      max-width: 1180px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toolbar-title strong,
    .toolbar-title span {
      display: block;
    }

    .toolbar-title strong {
      font-size: 15px;
    }

    .toolbar-title span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .scale-pill {
      min-width: 62px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .poster-viewport {
      width: 100%;
      min-height: 400px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    .poster-stage {
      position: relative;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 30px;
      box-shadow: var(--shadow);
    }

    .poster {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      transform-origin: top left;
      color: #f8fbff;
      background: var(--poster-bg, #090b20);
      border-radius: 30px;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.1);
      isolation: isolate;
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 8% 4%, var(--glow-1, rgba(89, 232, 255, 0.26)), transparent 30%),
        radial-gradient(circle at 94% 88%, var(--glow-2, rgba(123, 97, 255, 0.28)), transparent 35%),
        linear-gradient(145deg, transparent 46%, rgba(255, 255, 255, 0.035) 47%, transparent 48%);
    }

    .poster-bg-image {
      position: absolute;
      inset: 0;
      z-index: -4;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: var(--bg-opacity, 0);
      filter: saturate(0.9) contrast(1.08);
    }

    .poster-bg-shade {
      position: absolute;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      opacity: var(--shade-opacity, 0.75);
      background: linear-gradient(160deg, rgba(4, 7, 20, 0.72), rgba(7, 8, 24, 0.88));
    }

    .poster-noise {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.32;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.07'/%3E%3C/svg%3E");
    }

    .poster.theme-portal {
      --poster-bg: #120a22;
      --poster-accent: #ff79dc;
      --poster-accent-2: #9174ff;
      --poster-card: rgba(35, 16, 61, 0.84);
      --poster-card-strong: rgba(48, 20, 78, 0.92);
      --poster-line: rgba(241, 166, 255, 0.22);
      --poster-accent-soft: rgba(255, 121, 220, 0.11);
      --poster-accent-border: rgba(255, 121, 220, 0.36);
      --poster-accent-shadow: rgba(255, 121, 220, 0.43);
      --poster-accent-2-soft: rgba(145, 116, 255, 0.11);
      --glow-1: rgba(255, 79, 202, 0.27);
      --glow-2: rgba(132, 89, 255, 0.32);
    }

    .poster.theme-ember {
      --poster-bg: #160b13;
      --poster-accent: #ffd158;
      --poster-accent-2: #ff5578;
      --poster-card: rgba(45, 19, 31, 0.84);
      --poster-card-strong: rgba(61, 24, 36, 0.92);
      --poster-line: rgba(255, 193, 111, 0.2);
      --poster-accent-soft: rgba(255, 209, 88, 0.1);
      --poster-accent-border: rgba(255, 209, 88, 0.35);
      --poster-accent-shadow: rgba(255, 209, 88, 0.42);
      --poster-accent-2-soft: rgba(255, 85, 120, 0.1);
      --glow-1: rgba(255, 191, 71, 0.24);
      --glow-2: rgba(255, 70, 119, 0.28);
    }

    .poster.theme-ice {
      --poster-bg: #061221;
      --poster-accent: #a7efff;
      --poster-accent-2: #3a92ff;
      --poster-card: rgba(7, 32, 57, 0.86);
      --poster-card-strong: rgba(9, 43, 76, 0.92);
      --poster-line: rgba(150, 225, 255, 0.2);
      --poster-accent-soft: rgba(167, 239, 255, 0.1);
      --poster-accent-border: rgba(167, 239, 255, 0.35);
      --poster-accent-shadow: rgba(167, 239, 255, 0.42);
      --poster-accent-2-soft: rgba(58, 146, 255, 0.1);
      --glow-1: rgba(96, 220, 255, 0.25);
      --glow-2: rgba(38, 124, 255, 0.28);
    }

    .poster-inner {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 62px 68px 48px;
    }

    .poster-header,
    .poster-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .poster-brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.15em;
    }

    .poster-brand-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px var(--poster-accent-shadow));
    }

    .page-index {
      padding: 13px 18px;
      border: 1px solid var(--poster-line);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.72);
      background: rgba(255, 255, 255, 0.055);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .poster-main {
      min-height: 0;
      padding-top: 58px;
    }

    .poster-kicker {
      margin: 0 0 13px;
      color: var(--poster-accent);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .poster-title {
      max-width: 900px;
      margin: 0;
      font-size: 88px;
      line-height: 0.94;
      letter-spacing: -0.065em;
      font-weight: 950;
    }

    .poster-subtitle {
      max-width: 850px;
      margin: 20px 0 0;
      color: rgba(241, 245, 255, 0.67);
      font-size: 25px;
      line-height: 1.34;
      font-weight: 650;
    }

    .poster-footer {
      padding-top: 28px;
      border-top: 1px solid var(--poster-line);
      color: rgba(255, 255, 255, 0.62);
      font-size: 17px;
      font-weight: 750;
    }

    .poster-footer strong {
      color: #ffffff;
      font-weight: 850;
    }

    .penalty-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 38px;
    }

    .penalty-card {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 720px;
      padding: 26px 24px 22px;
      overflow: hidden;
      border: 1px solid var(--poster-line);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--poster-card-strong), var(--poster-card));
    }

    .penalty-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: var(--level-color);
      box-shadow: 0 0 24px var(--level-glow);
    }

    .level-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .level-number {
      color: var(--level-color);
      font-size: 16px;
      font-weight: 950;
      letter-spacing: 0.13em;
    }

    .level-tag {
      padding: 7px 10px;
      border: 1px solid var(--level-border);
      border-radius: 999px;
      color: var(--level-color);
      background: var(--level-soft);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .penalty-name {
      margin: 0;
      font-size: 42px;
      line-height: 0.98;
      letter-spacing: -0.04em;
      font-weight: 950;
    }

    .penalty-duration {
      margin: 9px 0 24px;
      color: var(--level-color);
      font-size: 22px;
      font-weight: 850;
    }

    .rule-list {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .rule-item {
      position: relative;
      display: grid;
      grid-template-columns: 12px 1fr;
      gap: 11px;
      align-items: start;
      color: rgba(248, 250, 255, 0.91);
      font-size: 21px;
      line-height: 1.24;
      font-weight: 690;
    }

    .rule-dot {
      width: 8px;
      height: 8px;
      margin-top: 9px;
      border-radius: 50%;
      background: var(--level-color);
      box-shadow: 0 0 12px var(--level-glow);
    }

    .card-note {
      margin-top: auto;
      padding: 16px;
      border: 1px solid var(--level-note-border);
      border-radius: 17px;
      color: rgba(255, 255, 255, 0.8);
      background: var(--level-note-soft);
      font-size: 17px;
      line-height: 1.3;
      font-weight: 720;
    }

    .filters-intro {
      max-width: 920px;
      margin: 34px 0 24px;
      padding: 28px 30px;
      border: 1px solid var(--poster-line);
      border-radius: 25px;
      color: rgba(255, 255, 255, 0.9);
      background: var(--poster-card);
      font-size: 27px;
      line-height: 1.32;
      font-weight: 740;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 28px;
    }

    .filter-chip {
      padding: 11px 16px;
      border: 1px solid var(--poster-line);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.055);
      font-size: 17px;
      font-weight: 780;
    }

    .bot-callout {
      display: grid;
      grid-template-columns: 68px 1fr auto;
      align-items: center;
      gap: 20px;
      padding: 22px 24px;
      border: 1px solid var(--poster-accent-border);
      border-radius: 25px;
      background: linear-gradient(135deg, var(--poster-accent-soft), var(--poster-accent-2-soft));
    }

    .bot-icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 21px;
      color: #07101c;
      background: var(--poster-accent);
    }

    .bot-icon svg {
      width: 36px;
      height: 36px;
    }

    .bot-copy small,
    .bot-copy strong {
      display: block;
    }

    .bot-copy small {
      margin-bottom: 5px;
      color: rgba(255, 255, 255, 0.58);
      font-size: 16px;
      font-weight: 700;
    }

    .bot-copy strong {
      font-size: 25px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .bot-path {
      max-width: 225px;
      color: var(--poster-accent);
      font-size: 17px;
      line-height: 1.25;
      font-weight: 850;
      text-align: right;
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 27px;
    }

    .step-card {
      min-height: 205px;
      padding: 23px 22px;
      border: 1px solid var(--poster-line);
      border-radius: 24px;
      background: var(--poster-card);
    }

    .step-number {
      display: block;
      margin-bottom: 23px;
      color: var(--poster-accent);
      font-size: 15px;
      font-weight: 950;
      letter-spacing: 0.14em;
    }

    .step-card h3 {
      margin: 0 0 10px;
      font-size: 23px;
      line-height: 1.1;
      font-weight: 900;
    }

    .step-card p {
      margin: 0;
      color: rgba(255, 255, 255, 0.69);
      font-size: 19px;
      line-height: 1.3;
      font-weight: 680;
    }

    .scope-banner {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 34px 0 20px;
      padding: 19px 22px;
      border: 1px solid var(--poster-accent-border);
      border-radius: 22px;
      color: #ffffff;
      background: var(--poster-accent-soft);
      font-size: 21px;
      line-height: 1.25;
      font-weight: 820;
    }

    .scope-badge {
      flex: 0 0 auto;
      padding: 8px 11px;
      border-radius: 10px;
      color: #06101a;
      background: var(--poster-accent);
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .outside-card {
      padding: 25px 27px;
      border: 1px solid var(--poster-line);
      border-radius: 26px;
      background: var(--poster-card-strong);
    }

    .outside-card small {
      display: block;
      margin-bottom: 12px;
      color: var(--poster-accent);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .outside-card p {
      margin: 0;
      color: rgba(255, 255, 255, 0.91);
      font-size: 24px;
      line-height: 1.34;
      font-weight: 720;
    }

    .important-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 18px 0;
    }

    .important-item {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 14px;
      min-height: 100px;
      padding: 18px;
      border: 1px solid var(--poster-line);
      border-radius: 22px;
      background: var(--poster-card);
    }

    .important-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #06101a;
      background: var(--poster-accent);
      font-size: 21px;
      font-weight: 950;
    }

    .important-item p {
      margin: 0;
      font-size: 20px;
      line-height: 1.28;
      font-weight: 760;
    }

    .appeal-card {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 24px;
      padding: 24px 27px;
      border-radius: 25px;
      color: #07101c;
      background: linear-gradient(135deg, var(--poster-accent), #ffffff 115%);
    }

    .appeal-card small,
    .appeal-card strong {
      display: block;
    }

    .appeal-card small {
      margin-bottom: 5px;
      color: rgba(6, 16, 26, 0.64);
      font-size: 15px;
      font-weight: 820;
    }

    .appeal-card strong {
      font-size: 25px;
      line-height: 1.18;
      font-weight: 950;
    }

    .appeal-link {
      padding: 13px 16px;
      border: 2px solid rgba(6, 16, 26, 0.16);
      border-radius: 14px;
      font-size: 17px;
      font-weight: 950;
      white-space: nowrap;
    }

    [contenteditable="true"] {
      cursor: text;
      border-radius: 5px;
      transition: background 140ms ease, box-shadow 140ms ease;
    }

    [contenteditable="true"]:hover {
      background: rgba(255, 255, 255, 0.055);
      box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.055);
    }

    [contenteditable="true"]:focus {
      background: rgba(255, 255, 255, 0.075);
      box-shadow: 0 0 0 6px rgba(89, 232, 255, 0.1);
    }

    .editable-wrap {
      position: relative;
      min-width: 0;
    }

    .remove-rule {
      position: absolute;
      top: -9px;
      right: -9px;
      z-index: 4;
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      color: #ffffff;
      background: #d82f5f;
      font-size: 18px;
      line-height: 1;
      opacity: 0;
      transform: scale(0.8);
    }

    .editable-wrap:hover .remove-rule,
    .remove-rule:focus-visible {
      opacity: 1;
      transform: scale(1);
    }

    .add-rule {
      width: 100%;
      min-height: 38px;
      margin-top: 15px;
      border: 1px dashed var(--level-border);
      border-radius: 13px;
      color: var(--level-color);
      background: transparent;
      font-size: 14px;
      font-weight: 850;
      opacity: 0.38;
    }

    .penalty-card:hover .add-rule,
    .add-rule:focus-visible {
      opacity: 1;
    }

    .export-clean .add-rule,
    .export-clean .remove-rule {
      display: none !important;
    }

    .export-clean [contenteditable="true"] {
      background: transparent !important;
      box-shadow: none !important;
      outline: none !important;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
      max-width: min(380px, calc(100vw - 40px));
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: #ffffff;
      background: rgba(20, 24, 43, 0.96);
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden-input {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 980px) {
      .main-layout {
        grid-template-columns: 270px minmax(0, 1fr);
      }

      .control-panel,
      .workspace {
        padding: 14px;
      }

      .brand-copy span,
      .header-export-text {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-rows: 64px auto;
      }

      .app-header {
        min-height: 64px;
        padding: 10px 12px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 12px;
      }

      .brand-copy strong {
        font-size: 14px;
      }

      .main-layout {
        display: flex;
        flex-direction: column;
      }

      .control-panel {
        position: relative;
        top: 0;
        order: 2;
        width: 100%;
        height: auto;
        border-top: 1px solid var(--line);
        border-right: 0;
      }

      .workspace {
        order: 1;
        padding: 12px 8px 18px;
      }

      .workspace-toolbar {
        padding: 0 4px;
      }

      .toolbar-title span,
      .scale-pill {
        display: none;
      }

      .page-list {
        grid-template-columns: repeat(3, 1fr);
      }

      .page-button {
        grid-template-columns: 1fr;
        justify-items: center;
        min-height: 78px;
        padding: 8px 5px;
        text-align: center;
      }

      .page-button-copy small,
      .page-chevron {
        display: none;
      }

      .page-button-copy strong {
        font-size: 12px;
      }

      .header-actions {
        gap: 5px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
      }

      .header-actions .action-btn {
        width: 40px;
        min-height: 38px;
        padding: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M8.5 12h7M12 8.5v7"></path>
          </svg>
        </div>
        <div class="brand-copy">
          <strong>Студия правил</strong>
          <span>PK XD PORTAL</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="undoBtn" type="button" title="Отменить, Ctrl+Z" aria-label="Отменить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 14-4-4 4-4"></path><path d="M5 10h8a6 6 0 0 1 6 6v1"></path></svg>
        </button>
        <button class="icon-btn" id="redoBtn" type="button" title="Вернуть, Ctrl+Y" aria-label="Вернуть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 4-4-4-4"></path><path d="M19 10h-8a6 6 0 0 0-6 6v1"></path></svg>
        </button>
        <button class="action-btn" id="quickExportBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
          <span class="header-export-text">Скачать карточку</span>
        </button>
      </div>
    </header>

    <div class="main-layout">
      <aside class="control-panel" aria-label="Панель настройки">
        <section class="panel-section">
          <div class="section-head">
            <h2>Карточки</h2>
            <span>3 страницы</span>
          </div>
          <nav class="page-list" id="pageList" aria-label="Страницы правил"></nav>
          <p class="helper">Нажми на любой текст в макете, чтобы изменить его.</p>
        </section>

        <section class="panel-section">
          <div class="section-head">
            <h2>Оформление</h2>
          </div>
          <div class="theme-grid" id="themeGrid">
            <button class="theme-button" type="button" data-theme="portal">
              <span class="theme-dot portal"></span>
              Портал
            </button>
            <button class="theme-button" type="button" data-theme="ember">
              <span class="theme-dot ember"></span>
              Огонь
            </button>
            <button class="theme-button" type="button" data-theme="ice">
              <span class="theme-dot ice"></span>
              Лёд
            </button>
          </div>

          <label class="field-label" for="backgroundInput">Свой фон</label>
          <div class="button-row">
            <button class="ghost-btn" id="chooseBackgroundBtn" type="button">Выбрать</button>
            <button class="ghost-btn" id="removeBackgroundBtn" type="button">Убрать</button>
          </div>
          <label class="field-label" for="backgroundOpacity">Яркость фона</label>
          <div class="range-row">
            <input id="backgroundOpacity" type="range" min="0" max="100" step="1" value="28">
            <span class="range-value" id="opacityValue">28%</span>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-head">
            <h2>Экспорт</h2>
            <span>1080 × 1350</span>
          </div>
          <button class="action-btn" id="exportCurrentBtn" type="button" style="width:100%">Скачать эту карточку</button>
          <div class="button-row" style="margin-top:8px">
            <button class="ghost-btn" id="exportAllBtn" type="button">Скачать все 3</button>
            <button class="ghost-btn" id="copyTextBtn" type="button">Копировать текст</button>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-head">
            <h2>Проект</h2>
          </div>
          <div class="button-row">
            <button class="ghost-btn" id="saveProjectBtn" type="button">Сохранить</button>
            <button class="ghost-btn" id="openProjectBtn" type="button">Открыть</button>
          </div>
          <button class="ghost-btn" id="resetBtn" type="button" style="width:100%;margin-top:8px">Вернуть новые правила</button>
          <p class="helper">Изменения сохраняются автоматически в этом браузере.</p>
        </section>
      </aside>

      <main class="workspace">
        <div class="workspace-toolbar">
          <div class="toolbar-title">
            <strong id="currentPageTitle">Наказания</strong>
            <span>Редактирование прямо на карточке</span>
          </div>
          <div class="toolbar-group">
            <button class="icon-btn" id="previousPageBtn" type="button" title="Предыдущая карточка" aria-label="Предыдущая карточка">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
            </button>
            <span class="scale-pill" id="scaleValue">100%</span>
            <button class="icon-btn" id="nextPageBtn" type="button" title="Следующая карточка" aria-label="Следующая карточка">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          </div>
        </div>

        <div class="poster-viewport" id="posterViewport">
          <div class="poster-stage" id="posterStage">
            <article class="poster theme-portal" id="poster" aria-label="Предпросмотр карточки правил"></article>
          </div>
        </div>
      </main>
    </div>
  </div>

  <input class="hidden-input" id="backgroundInput" type="file" accept="image/*">
  <input class="hidden-input" id="projectInput" type="file" accept="application/json,.json">
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

      const clean = String(hex).replace("#", "");
      const value = Number.parseInt(clean, 16);
      const red = (value >> 16) & 255;
      const green = (value >> 8) & 255;
      const blue = value & 255;
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (isValidState(saved)) return normalizeState(saved);
      } catch (error) {
        console.info("Автосохранение не найдено", error);
      }
      return clone(DEFAULT_STATE);
    }

    function normalizeState(value) {
      const normalized = clone(value);
      const allowedThemes = ["portal", "ember", "ice"];
      if (normalized.theme === "electric" || !allowedThemes.includes(normalized.theme)) {
        normalized.theme = "portal";
      }
      const opacity = Number(normalized.backgroundOpacity);
      normalized.backgroundOpacity = Number.isFinite(opacity) ? Math.max(0, Math.min(100, opacity)) : 28;
      return normalized;
    }

    function getShadeOpacity() {
      if (!state.backgroundImage) return 0.75;
      return Math.max(0.34, 0.88 - state.backgroundOpacity * 0.0054);
    }

    function isValidState(value) {
      return Boolean(
        value &&
        value.version === 2 &&
        Array.isArray(value.pages) &&
        value.pages.length === 3 &&
        value.pages[0]?.id === "penalties" &&
        value.pages[1]?.id === "filters" &&
        value.pages[2]?.id === "important"
      );
    }

    function persist(immediate = false) {
      const save = () => {
        persistTimer = null;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          showToast("Не удалось сохранить автоматически. Скачай проект вручную.");
        }
      };
      clearTimeout(persistTimer);
      if (immediate) save();
      else persistTimer = setTimeout(save, 160);
    }

    function setByPath(target, path, value) {
      const keys = path.split(".");
      const last = keys.pop();
      const parent = keys.reduce((current, key) => current[key], target);
      parent[last] = value;
    }

    function beginTextEdit() {
      if (!editSnapshot) editSnapshot = JSON.stringify(state);
    }

    function endTextEdit() {
      if (!editSnapshot) return;
      if (editSnapshot !== JSON.stringify(state)) {
        undoStack.push(editSnapshot);
        if (undoStack.length > 60) undoStack.shift();
        redoStack = [];
      }
      editSnapshot = null;
      updateHistoryButtons();
      persist();
      renderPageList();
    }

    function mutate(action) {
      undoStack.push(JSON.stringify(state));
      if (undoStack.length > 60) undoStack.shift();
      redoStack = [];
      action();
      persist();
      render();
    }

    function undo() {
      const previous = undoStack.pop();
      if (!previous) return;
      redoStack.push(JSON.stringify(state));
      state = JSON.parse(previous);
      persist();
      render();
      showToast("Изменение отменено");
    }

    function redo() {
      const next = redoStack.pop();
      if (!next) return;
      undoStack.push(JSON.stringify(state));
      state = JSON.parse(next);
      persist();
      render();
      showToast("Изменение возвращено");
    }

    function updateHistoryButtons() {
      undoBtn.disabled = undoStack.length === 0;
      redoBtn.disabled = redoStack.length === 0;
    }

    function editable(tag, className, path, value, multiline = false) {
      const element = document.createElement(tag);
      element.className = className;
      element.contentEditable = "plaintext-only";
      element.spellcheck = true;
      element.dataset.path = path;
      element.textContent = value;
      element.addEventListener("focus", beginTextEdit);
      element.addEventListener("input", () => {
        const nextValue = multiline ? element.innerText.trimEnd() : element.innerText.replace(/\n+/g, " ").trimStart();
        setByPath(state, path, nextValue);
        persist();
      });
      element.addEventListener("keydown", event => {
        if (!multiline && event.key === "Enter") {
          event.preventDefault();
          element.blur();
        }
      });
      element.addEventListener("blur", endTextEdit);
      return element;
    }

    function basePoster(page, index) {
      poster.className = `poster theme-${state.theme}`;
      poster.style.setProperty("--bg-opacity", `${state.backgroundOpacity / 100}`);
      poster.style.setProperty("--shade-opacity", String(getShadeOpacity()));
      poster.innerHTML = "";

      if (state.backgroundImage) {
        const image = document.createElement("img");
        image.className = "poster-bg-image";
        image.src = state.backgroundImage;
        image.alt = "";
        poster.appendChild(image);
      }

      const shade = document.createElement("div");
      shade.className = "poster-bg-shade";
      poster.appendChild(shade);

      const noise = document.createElement("div");
      noise.className = "poster-noise";
      poster.appendChild(noise);

      const inner = document.createElement("div");
      inner.className = "poster-inner";

      const header = document.createElement("header");
      header.className = "poster-header";
      header.innerHTML = `<div class="poster-brand"><img class="poster-brand-logo" src="${PORTAL_BADGE_DATA}" alt="" aria-hidden="true"><span>PK XD PORTAL</span></div><div class="page-index">0${index + 1} / 03</div>`;
      inner.appendChild(header);

      const main = document.createElement("section");
      main.className = "poster-main";
      main.appendChild(editable("p", "poster-kicker", `pages.${index}.kicker`, page.kicker));

      main.appendChild(editable("p", "poster-subtitle", `pages.${index}.subtitle`, page.subtitle, true));
      inner.appendChild(main);

      const footer = document.createElement("footer");
      footer.className = "poster-footer";
      footer.appendChild(editable("span", "", `pages.${index}.footer`, page.footer, true));
      const channel = document.createElement("strong");
      channel.textContent = "t.me/pkxdportal";
      footer.appendChild(channel);
      inner.appendChild(footer);

      poster.appendChild(inner);
      return main;
    }

    function renderPenalties(page, pageIndex, main) {
      const grid = document.createElement("div");

        card.className = "penalty-card";
        card.style.setProperty("--level-color", section.color);
        card.style.setProperty("--level-glow", `${section.color}66`);
        card.style.setProperty("--level-border", hexToRgba(section.color, 0.34));
        card.style.setProperty("--level-soft", hexToRgba(section.color, 0.1));
        card.style.setProperty("--level-note-border", hexToRgba(section.color, 0.22));
        card.style.setProperty("--level-note-soft", hexToRgba(section.color, 0.08));

        const levelRow = document.createElement("div");
        levelRow.className = "level-row";
        levelRow.appendChild(editable("span", "level-number", `${path}.number`, section.number));
        levelRow.appendChild(editable("span", "level-tag", `${path}.tag`, section.tag));
        card.appendChild(levelRow);
        card.appendChild(editable("h2", "penalty-name", `${path}.name`, section.name));
        card.appendChild(editable("p", "penalty-duration", `${path}.duration`, section.duration));

        const list = document.createElement("ul");
        list.className = "rule-list";
        section.items.forEach((item, itemIndex) => {
          const wrapper = document.createElement("li");

          const dot = document.createElement("span");
          dot.className = "rule-dot";

          wrapper.appendChild(editable("span", "", `${path}.items.${itemIndex}`, item, true));

            remove.type = "button";
            remove.textContent = "×";
            remove.title = "Удалить пункт";
            remove.setAttribute("aria-label", "Удалить пункт");
            remove.addEventListener("click", event => {
              event.stopPropagation();
              mutate(() => state.pages[pageIndex].sections[sectionIndex].items.splice(itemIndex, 1));
            });
            wrapper.appendChild(remove);
          }
          list.appendChild(wrapper);
        });
        card.appendChild(list);

        const add = document.createElement("button");
        add.className = "add-rule";
        add.type = "button";

    function renderImportant(page, pageIndex, main) {
      const scope = document.createElement("div");
      scope.className = "scope-banner";
      const badge = document.createElement("span");
      badge.className = "scope-badge";
      badge.textContent = "Где";
      scope.appendChild(badge);
      scope.appendChild(editable("span", "", `pages.${pageIndex}.scope`, page.scope, true));

      const outside = document.createElement("section");
      outside.className = "outside-card";
      outside.appendChild(editable("small", "", `pages.${pageIndex}.outsideLabel`, page.outsideLabel));
      outside.appendChild(editable("p", "", `pages.${pageIndex}.outside`, page.outside, true));
      main.appendChild(outside);

      const list = document.createElement("div");
      list.className = "important-list";
      page.important.forEach((item, itemIndex) => {
        const card = document.createElement("section");

        const icon = document.createElement("span");
        icon.className = "important-icon";
        icon.textContent = itemIndex === 0 ? "!" : "✓";
        card.appendChild(icon);
        card.appendChild(editable("p", "", `pages.${pageIndex}.important.${itemIndex}`, item, true));
        list.appendChild(card);
      });
      main.appendChild(list);

      const appeal = document.createElement("section");
      appeal.className = "appeal-card";
      const copy = document.createElement("div");
      copy.appendChild(editable("small", "", `pages.${pageIndex}.appealLabel`, page.appealLabel));
      copy.appendChild(editable("strong", "", `pages.${pageIndex}.appealText`, page.appealText, true));
      appeal.appendChild(copy);
      appeal.appendChild(editable("div", "appeal-link", `pages.${pageIndex}.appealLink`, page.appealLink));
      main.appendChild(appeal);

    function renderPage() {
      const pageIndex = Math.max(0, Math.min(2, Number(state.activePage) || 0));
      state.activePage = pageIndex;
      const page = state.pages[pageIndex];
      currentPageTitle.textContent = page.navTitle;
      const main = basePoster(page, pageIndex);
      if (page.id === "penalties") renderPenalties(page, pageIndex, main);
      if (page.id === "filters") renderFilters(page, pageIndex, main);
      if (page.id === "important") renderImportant(page, pageIndex, main);
      requestAnimationFrame(fitPoster);
    }

    function renderPageList() {
      pageList.innerHTML = "";
      state.pages.forEach((page, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `page-button${index === state.activePage ? " active" : ""}`;
        button.setAttribute("aria-current", index === state.activePage ? "page" : "false");

        const number = document.createElement("span");
        number.className = "page-number";
        number.textContent = `0${index + 1}`;
        const copy = document.createElement("span");
        copy.className = "page-button-copy";
        const strong = document.createElement("strong");
        strong.textContent = page.navTitle;
        const small = document.createElement("small");
        small.textContent = page.navMeta;
        copy.append(strong, small);
        const chevron = document.createElement("span");
        chevron.className = "page-chevron";
        chevron.textContent = "›";
        button.append(number, copy, chevron);
        button.addEventListener("click", () => {
          state.activePage = index;
          persist();
          render();
        });
        pageList.appendChild(button);
      });
    }

    function renderControls() {
      document.querySelectorAll("[data-theme]").forEach(button => {
        button.classList.toggle("active", button.dataset.theme === state.theme);
      });
      backgroundOpacity.value = String(state.backgroundOpacity);
      opacityValue.textContent = `${state.backgroundOpacity}%`;
      document.getElementById("removeBackgroundBtn").disabled = !state.backgroundImage;
      document.getElementById("previousPageBtn").disabled = state.activePage === 0;
      document.getElementById("nextPageBtn").disabled = state.activePage === state.pages.length - 1;
      updateHistoryButtons();
    }

    function render() {
      renderPageList();
      renderPage();
      renderControls();
    }

    function fitPoster() {
      const available = Math.max(280, posterViewport.clientWidth - 4);
      const maxHeight = Math.max(400, window.innerHeight - 130);
      const scale = Math.min(1, available / 1080, maxHeight / 1350);
      poster.style.transform = `scale(${scale})`;
      posterStage.style.width = `${1080 * scale}px`;
      posterStage.style.height = `${1350 * scale}px`;
      scaleValue.textContent = `${Math.round(scale * 100)}%`;
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function imageToDataUrl(file) {
      const original = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const image = await new Promise((resolve, reject) => {
        const value = new Image();
        value.onload = () => resolve(value);
        value.onerror = reject;
        value.src = original;
      });

      const maxSize = 1800;
      const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.86);
    }

    function cleanCloneForExport() {
      const copy = poster.cloneNode(true);
      copy.classList.add("export-clean");
      copy.style.transform = "none";
      copy.querySelectorAll("[contenteditable]").forEach(element => element.removeAttribute("contenteditable"));
      copy.querySelectorAll("button").forEach(element => element.remove());
      const holder = document.createElement("div");
      holder.style.position = "fixed";
      holder.style.left = "-12000px";
      holder.style.top = "0";
      holder.style.width = "1080px";
      holder.style.height = "1350px";
      holder.style.zIndex = "-1000";
      holder.appendChild(copy);
      document.body.appendChild(holder);
      return { copy, holder };
    }

    async function makeCanvas() {
      if (typeof html2canvas !== "function") {
        throw new Error("Модуль экспорта не загрузился. Открой файл с интернетом и повтори.");
      }
      const { copy, holder } = cleanCloneForExport();
      try {
        if (document.fonts?.ready) await document.fonts.ready;
        return await html2canvas(copy, {
          width: 1080,
          height: 1350,
          scale: 1,
          useCORS: true,
          backgroundColor: null,
          logging: false
        });
      } finally {
        holder.remove();
      }
    }

    function canvasBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Не удалось создать PNG")), "image/png");
      });
    }

    async function exportCurrent(silent = false) {
      if (exporting) return;
      exporting = true;
      setExportButtons(true);
      try {
        const canvas = await makeCanvas();
        const blob = await canvasBlob(canvas);
        const page = state.pages[state.activePage];
        downloadBlob(blob, `pkxd-portal-${state.activePage + 1}-${page.id}.png`);
        if (!silent) showToast("Карточка сохранена в PNG");
      } catch (error) {
        showToast(error.message || "Не удалось сохранить карточку");
      } finally {
        exporting = false;
        setExportButtons(false);
      }
    }

    async function exportAll() {
      if (exporting) return;
      exporting = true;
      setExportButtons(true);
      const originalPage = state.activePage;
      try {
        for (let index = 0; index < state.pages.length; index += 1) {
          state.activePage = index;
          render();
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          const canvas = await makeCanvas();
          const blob = await canvasBlob(canvas);
          downloadBlob(blob, `pkxd-portal-${index + 1}-${state.pages[index].id}.png`);
          await new Promise(resolve => setTimeout(resolve, 220));
        }
        showToast("Три карточки сохранены");
      } catch (error) {
        showToast(error.message || "Не удалось сохранить карточки");
      } finally {
        state.activePage = originalPage;
        persist();
        render();
        exporting = false;
        setExportButtons(false);
      }
    }

    function setExportButtons(disabled) {
      ["quickExportBtn", "exportCurrentBtn", "exportAllBtn"].forEach(id => {
        document.getElementById(id).disabled = disabled;
      });
    }

    function rulesAsText() {
      const penalties = state.pages[0];
      const filters = state.pages[1];
      const important = state.pages[2];
      const lines = [
        "🖥 Правила чатов PK XD PORTAL",
        "",
        "Правила действуют только в наших чатах.",
        ""
      ];
      penalties.sections.forEach(section => {
        const label = section.name === "Мут" ? `${section.name} ${section.duration}` : section.name === "Бан" ? "Бан навсегда" : section.name;
        lines.push(`🔵 ${label}`, "");
        section.items.forEach(item => lines.push(`➤ ${item}`));
        if (section.name === "Варн") lines.push("", "3 варна = бан.");
        if (section.name === "Бан") lines.push("", section.note);
        lines.push("");
      });
      lines.push(
        "🛡 Личные фильтры",
        "",
        filters.intro,
        `${filters.bot} → ${filters.botPath}.`,
        `${filters.steps[1].title}: ${filters.steps[1].text}`,
        `${filters.steps[2].title}: ${filters.steps[2].text}`,
        "",
        "❤ Важно",
        "",
        important.outside,
        "",
        ...important.important.map(item => `➤ ${item}`),
        `➤ Снять некоторые наказания: https://${important.appealLink}`
      );
      return lines.join("\n");
    }

    async function copyText() {
      try {
        await navigator.clipboard.writeText(rulesAsText());
        showToast("Текст правил скопирован");
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = rulesAsText();
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        showToast("Текст правил скопирован");
      }
    }

    document.getElementById("themeGrid").addEventListener("click", event => {
      const button = event.target.closest("[data-theme]");
      if (!button || button.dataset.theme === state.theme) return;
      mutate(() => { state.theme = button.dataset.theme; });
    });

    document.getElementById("chooseBackgroundBtn").addEventListener("click", () => backgroundInput.click());
    document.getElementById("removeBackgroundBtn").addEventListener("click", () => {
      if (!state.backgroundImage) return;
      mutate(() => { state.backgroundImage = ""; });
    });

    backgroundInput.addEventListener("change", async () => {
      const file = backgroundInput.files?.[0];
      if (!file) return;
      try {
        const dataUrl = await imageToDataUrl(file);
        mutate(() => { state.backgroundImage = dataUrl; });
        showToast("Фон добавлен");
      } catch (error) {
        showToast("Не удалось открыть изображение");
      }
      backgroundInput.value = "";
    });

    backgroundOpacity.addEventListener("input", () => {
      state.backgroundOpacity = Number(backgroundOpacity.value);
      opacityValue.textContent = `${state.backgroundOpacity}%`;
      poster.style.setProperty("--bg-opacity", `${state.backgroundOpacity / 100}`);
      poster.style.setProperty("--shade-opacity", String(getShadeOpacity()));
      persist();
    });

    backgroundOpacity.addEventListener("pointerdown", () => {
      opacitySnapshot = JSON.stringify(state);
    });

    backgroundOpacity.addEventListener("focus", () => {
      if (!opacitySnapshot) opacitySnapshot = JSON.stringify(state);
    });

    backgroundOpacity.addEventListener("change", () => {
      if (opacitySnapshot && opacitySnapshot !== JSON.stringify(state)) {
        undoStack.push(opacitySnapshot);
        if (undoStack.length > 60) undoStack.shift();
        redoStack = [];
        opacitySnapshot = null;
        updateHistoryButtons();
      }
      renderControls();
    });

    backgroundOpacity.addEventListener("blur", () => {
      opacitySnapshot = null;
    });

    undoBtn.addEventListener("click", undo);
    redoBtn.addEventListener("click", redo);
    document.getElementById("previousPageBtn").addEventListener("click", () => {
      state.activePage = Math.max(0, state.activePage - 1);
      persist();
      render();
    });
    document.getElementById("nextPageBtn").addEventListener("click", () => {
      state.activePage = Math.min(state.pages.length - 1, state.activePage + 1);
      persist();
      render();
    });
    document.getElementById("quickExportBtn").addEventListener("click", () => exportCurrent());
    document.getElementById("exportCurrentBtn").addEventListener("click", () => exportCurrent());
    document.getElementById("exportAllBtn").addEventListener("click", exportAll);
    document.getElementById("copyTextBtn").addEventListener("click", copyText);

    document.getElementById("saveProjectBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      downloadBlob(blob, "pkxd-portal-rules-project.json");
      showToast("Проект сохранён");
    });

    document.getElementById("openProjectBtn").addEventListener("click", () => projectInput.click());
    projectInput.addEventListener("change", async () => {
      const file = projectInput.files?.[0];
      if (!file) return;
      try {
        const loaded = JSON.parse(await file.text());
        if (!isValidState(loaded)) throw new Error("Неверный формат");
        undoStack.push(JSON.stringify(state));
        redoStack = [];
        state = loaded;
        persist();
        render();
        showToast("Проект открыт");
      } catch (error) {
        showToast("Этот файл не похож на проект правил");
      }
      projectInput.value = "";
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      const confirmed = window.confirm("Вернуть исходный текст новых правил и удалить текущие изменения?");
      if (!confirmed) return;
      mutate(() => {
        const activePage = state.activePage;
        state = clone(DEFAULT_STATE);
        state.activePage = activePage;
      });
      showToast("Новые правила восстановлены");
    });

    document.addEventListener("keydown", event => {
      const modifier = event.ctrlKey || event.metaKey;
      if (modifier && event.key.toLowerCase() === "z" && !event.shiftKey) {
        event.preventDefault();
        undo();
      }
      if (modifier && (event.key.toLowerCase() === "y" || (event.key.toLowerCase() === "z" && event.shiftKey))) {
        event.preventDefault();
        redo();
      }
      if (!modifier && !event.target.closest("[contenteditable]") && event.key === "ArrowRight") {
        state.activePage = Math.min(2, state.activePage + 1);
        persist();
        render();
      }
      if (!modifier && !event.target.closest("[contenteditable]") && event.key === "ArrowLeft") {
        state.activePage = Math.max(0, state.activePage - 1);
        persist();
        render();
      }
    });

    window.addEventListener("resize", fitPoster);
    window.addEventListener("beforeunload", () => persist(true));
    if (window.ResizeObserver) new ResizeObserver(fitPoster).observe(posterViewport);
    render();
  </script>
</body>
</html>

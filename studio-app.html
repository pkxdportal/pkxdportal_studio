<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>PK XD PORTAL — Редакторы</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#090916;color:#f8f5ff;font-family:Arial,sans-serif}
.topbar{height:54px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:#0d0c1a;border-bottom:1px solid #363148;white-space:nowrap;overflow-x:auto;scrollbar-width:thin}
.topbar a,.topbar button{font:inherit;display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:#ccc8e1;background:#19172c;border:1px solid #343149;cursor:pointer;font-size:13px}
.topbar a:hover,.topbar button:hover,.topbar .active{background:#422348;color:white;border-color:#865a9b}
.topbar .home{color:white;background:#29203b;font-weight:700}
.topbar .fill{flex:1}
iframe{display:block;height:calc(100dvh - 54px);width:100%;border:0;background:#090916;opacity:0;transition:opacity .12s}
iframe.ready{opacity:1}
@media(max-width:620px){.topbar{padding:5px;gap:5px}.topbar a,.topbar button{font-size:12px;padding:9px 10px}}
</style>
<script src="editor-access.js"></script>
<script>
if(!window.PKXDEditorAccess || !PKXDEditorAccess.isUnlocked()) location.replace("index.html");
</script>
</head>
<body>
<header class="topbar" aria-label="Навигация редакторов">
<a class="home" href="index.html">← На главную</a>
<button type="button" data-view="rules">Правила</button>
<button type="button" data-view="chests">Сундуки</button>
<button type="button" data-view="avatars">Аватарки</button>
<span class="fill"></span>
<a href="posts-admin.html">Посты</a>
</header>
<iframe id="engine" title="Редактор PK XD PORTAL" allow="web-share" referrerpolicy="same-origin"></iframe>
<script>
(function(){
 "use strict";
 const frame=document.getElementById("engine");
 const valid=["rules","chests","avatars"];
 let view=valid.includes(location.hash.slice(1))?location.hash.slice(1):"rules";
 function updateTabs(){
   document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===view));
 }
 function returnHome(){ location.assign("index.html"); }
 function select(next){
   if(!valid.includes(next))return;
   view=next;
   history.replaceState(null,"","#"+next);
   updateTabs();
   const win=frame.contentWindow;
   if(win && typeof win.showPortalView==="function") {
     try{win.showPortalView(next);}catch(e){console.warn("Переключение редактора",e);}
   }
 }
 document.querySelectorAll("[data-view]").forEach(btn=>btn.addEventListener("click",()=>select(btn.dataset.view)));
 function attach(){
  try{
   const w=frame.contentWindow,d=frame.contentDocument;
   if(!w || !d || typeof w.showPortalView!=="function")throw Error("Редактор ещё загружается");
   const st=d.createElement("style"); st.textContent=`
      /* В студии есть старая главная. Её заменяет единая домашняя страница. */
      .portal-launcher{display:none!important}
      /* Исправление исчезающего текста правил: старый авторасчёт уменьшал шрифт до 1px. */
      .poster-main-penalties .rule-list{gap:5px!important}
      .poster-main-penalties .rule-item{font-size:24px!important;line-height:1.12!important}
      .poster-main-penalties .penalty-card:nth-child(3) .rule-item{font-size:20px!important;line-height:1.07!important}
      .poster-main-penalties .penalty-card:nth-child(3) .rule-list{gap:3px!important}
      .poster-main-penalties .rule-item [contenteditable]{font-size:inherit!important;line-height:inherit!important}
     `;
   d.head.appendChild(st);
   // Оставляем адаптацию заметок и названий. Только пункты правил
   // закреплены читаемым размером через CSS !important.
   // Старая кнопка переключения должна возвращать на основную страницу.
   d.addEventListener("click",event=>{
      if(event.target.closest("#portalSwitcherBtn")){event.preventDefault();event.stopImmediatePropagation();returnHome();}
   },true);
   const launcher=d.getElementById("portalLauncher");
   if(launcher) {
     new MutationObserver(()=>{if(!launcher.hidden) returnHome();}).observe(launcher,{attributes:true,attributeFilter:["hidden"]});
   }
   select(view);
   frame.classList.add("ready");
  }catch(err){
    console.warn("Ошибка подготовки студии",err);
    frame.classList.add("ready");
  }
 }
 frame.addEventListener("load",attach);
 updateTabs();
 frame.src="studio-engine.html#"+view;
 window.addEventListener("hashchange",()=>select(location.hash.slice(1)));
})();
</script>
</body></html>
